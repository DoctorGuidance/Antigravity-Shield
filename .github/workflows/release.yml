          node-version: 24
          cache: "npm"

      - name: Install frontend dependencies
        run: npm install --legacy-peer-deps --prefer-offline

      - name: Sync version from release tag & optimize build speed
        shell: bash
        run: |
          TARGET_VER="${{ github.event.inputs.release_tag || github.ref_name }}"
          TARGET_VER="${TARGET_VER#v}"
          if [ -n "$TARGET_VER" ] && [ "$TARGET_VER" != "refs/heads/main" ]; then
            echo "Synchronizing project versions to $TARGET_VER"
            node -e "
              const fs = require('fs');
              ['package.json', 'src-tauri/tauri.conf.json'].forEach(f => {
                if (fs.existsSync(f)) {
                  const d = JSON.parse(fs.readFileSync(f, 'utf8'));
                  d.version = '$TARGET_VER';
                  fs.writeFileSync(f, JSON.stringify(d, null, 2) + '\n');
                }
              });
            "
            if [ -f src-tauri/Cargo.toml ]; then
              sed -i.bak -E "s/^version = \"[0-9]+\.[0-9]+\.[0-9]+.*\"/version = \"$TARGET_VER\"/" src-tauri/Cargo.toml && rm -f src-tauri/Cargo.toml.bak
            fi
            if [ -f src-tauri/Cargo.lock ]; then
              sed -i.bak -E '/name = "antigravity-shield"/{n;s/version = "[0-9]+\.[0-9]+\.[0-9]+.*"/version = "'"$TARGET_VER"'"/;}' src-tauri/Cargo.lock && rm -f src-tauri/Cargo.lock.bak
            fi
            cargo update -p antigravity-shield --manifest-path src-tauri/Cargo.toml || true
          fi
          node -e "
            const fs = require('fs');
            const p = 'src-tauri/tauri.conf.json';
            if (fs.existsSync(p)) {
              const c = JSON.parse(fs.readFileSync(p, 'utf8'));
              if (c.build) c.build.beforeBuildCommand = 'npx vite build';
              fs.writeFileSync(p, JSON.stringify(c, null, 2), 'utf8');
              console.log('Optimized beforeBuildCommand to npx vite build');
            }
          "

      - name: Disable updater artifacts without signing key
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          node -e "
          const fs = require('fs');
          const p = 'src-tauri/tauri.conf.json';
          if (fs.existsSync(p)) {
            const c = JSON.parse(fs.readFileSync(p, 'utf8'));
            if (!process.env.TAURI_SIGNING_PRIVATE_KEY || process.env.TAURI_SIGNING_PRIVATE_KEY.trim() === '') {
              if (c.bundle) c.bundle.createUpdaterArtifacts = false;
              fs.writeFileSync(p, JSON.stringify(c, null, 2), 'utf8');
              console.log('No signing key: disabled createUpdaterArtifacts');
            } else {
              console.log('Updater signing key configured.');
            }
          }
          "

      - name: Build macOS bundles
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri build --bundles dmg,app --ignore-version-mismatches 2>&1 | tee tauri-build-macos.log

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-macos
          path: tauri-build-macos.log

      - name: Upload Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-macos
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/updater/*.tar.gz*
          if-no-files-found: warn

  # Linux Build (Only runs on Major/Minor releases like 5.3.0, skipped for patch releases like 5.3.1)
  build-linux:
    name: Build Linux (.deb, .AppImage)
    needs: [check-release-type]
    if: needs.check-release-type.outputs.build_unix == 'true'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            pkg-config \
            libsoup-3.0-dev \
            javascriptcoregtk-4.1 \
            libjavascriptcoregtk-4.1-dev \
            libnm-dev \
            xdg-utils

      - name: Rust setup
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Node.js setup
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"

      - name: Install frontend dependencies
        run: npm install --legacy-peer-deps --prefer-offline

      - name: Sync version from release tag & optimize build speed
        shell: bash
        run: |
          TARGET_VER="${{ github.event.inputs.release_tag || github.ref_name }}"
          TARGET_VER="${TARGET_VER#v}"
          if [ -n "$TARGET_VER" ] && [ "$TARGET_VER" != "refs/heads/main" ]; then
            echo "Synchronizing project versions to $TARGET_VER"
            node -e "
              const fs = require('fs');
              ['package.json', 'src-tauri/tauri.conf.json'].forEach(f => {
                if (fs.existsSync(f)) {
                  const d = JSON.parse(fs.readFileSync(f, 'utf8'));
                  d.version = '$TARGET_VER';
                  fs.writeFileSync(f, JSON.stringify(d, null, 2) + '\n');
                }
              });
            "
            if [ -f src-tauri/Cargo.toml ]; then
              sed -i.bak -E "s/^version = \"[0-9]+\.[0-9]+\.[0-9]+.*\"/version = \"$TARGET_VER\"/" src-tauri/Cargo.toml && rm -f src-tauri/Cargo.toml.bak
            fi
            if [ -f src-tauri/Cargo.lock ]; then
              sed -i.bak -E '/name = "antigravity-shield"/{n;s/version = "[0-9]+\.[0-9]+\.[0-9]+.*"/version = "'"$TARGET_VER"'"/;}' src-tauri/Cargo.lock && rm -f src-tauri/Cargo.lock.bak
            fi
            cargo update -p antigravity-shield --manifest-path src-tauri/Cargo.toml || true
          fi
          node -e "
            const fs = require('fs');
            const p = 'src-tauri/tauri.conf.json';
            if (fs.existsSync(p)) {
              const c = JSON.parse(fs.readFileSync(p, 'utf8'));
              if (c.build) c.build.beforeBuildCommand = 'npx vite build';
              fs.writeFileSync(p, JSON.stringify(c, null, 2), 'utf8');
              console.log('Optimized beforeBuildCommand to npx vite build');
            }
          "

      - name: Disable updater artifacts without signing key
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          node -e "
          const fs = require('fs');
          const p = 'src-tauri/tauri.conf.json';
          if (fs.existsSync(p)) {
            const c = JSON.parse(fs.readFileSync(p, 'utf8'));
            if (!process.env.TAURI_SIGNING_PRIVATE_KEY || process.env.TAURI_SIGNING_PRIVATE_KEY.trim() === '') {
              if (c.bundle) c.bundle.createUpdaterArtifacts = false;
              fs.writeFileSync(p, JSON.stringify(c, null, 2), 'utf8');
              console.log('No signing key: disabled createUpdaterArtifacts');
            } else {
              console.log('Updater signing key configured.');
            }
          }
          "

      - name: Build Linux packages
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri build --bundles deb,appimage --ignore-version-mismatches 2>&1 | tee tauri-build-linux.log

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-linux
          path: tauri-build-linux.log

      - name: Upload Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-linux
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/updater/*.tar.gz*
          if-no-files-found: warn

  # Publish release assets & updater.json
  publish-release:
    name: Publish Release to GitHub
    needs: [check-release-type, build-windows, build-macos, build-linux]
    if: always() && !cancelled() && !contains(needs.*.result, 'failure')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-artifacts
          pattern: "{release-assets-*,updater-json-*}"
          merge-multiple: true

      - name: Extract Release Notes
        run: |
          TARGET_VER="${{ github.event.inputs.release_tag || github.ref_name }}"
          echo "Extracting release notes for version $TARGET_VER"
          awk -v ver="$TARGET_VER" '
            BEGIN { capture=0 }
            $0 ~ "^[[:space:]]*[*+-][[:space:]]+\\*\\*" ver { capture=1; next }
            capture && $0 ~ "^[[:space:]]*[*+-][[:space:]]+\\*\\*v" { capture=0; exit }
            capture { print }
          ' CHANGELOG.md | sed 's/^[[:space:]]\{8\}//' > release_notes.md
          if [ ! -s release_notes.md ]; then
            echo "# Antigravity Shield $TARGET_VER" > release_notes.md
            echo "" >> release_notes.md
            echo "Official release for Antigravity Shield $TARGET_VER. Download installers below." >> release_notes.md
          fi

      - name: Build updater.json from signatures
        env:
          VERSION: ${{ github.event.inputs.release_tag || github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          DOWNLOAD_BASE="https://github.com/${REPO}/releases/download/${VERSION}"
          VER="${VERSION#v}"

          read_sig() {
            local pattern="$1"
            local sig_file
            sig_file=$(find all-artifacts -name "$pattern" -type f 2>/dev/null | head -1)
            if [ -n "$sig_file" ] && [ -f "$sig_file" ]; then
              cat "$sig_file"
            else
              echo ""
            fi
          }

          WINDOWS_NSIS_SIG=$(read_sig "*_x64-setup.exe.sig")
          WIN_EXE=$(find all-artifacts -name "*_x64-setup.exe" -type f -exec basename {} \; 2>/dev/null | head -1)
          WIN_EXE_CLEAN="${WIN_EXE// /.}"
          if [ -z "$WIN_EXE_CLEAN" ]; then
            WIN_EXE_CLEAN="Antigravity.Shield_${VER}_x64-setup.exe"
          fi

          # Base configuration with Windows platform
          UPDATER_JSON=$(jq -n \
            --arg version "$VER" \
            --arg notes "Antigravity Shield $VERSION release" \
            --arg pub_date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg dl "$DOWNLOAD_BASE" \
            --arg win_nsis_sig "$WINDOWS_NSIS_SIG" \
            --arg win_exe "$WIN_EXE_CLEAN" \
            '{
              version: $version,
              notes: $notes,
              pub_date: $pub_date,
              platforms: {
                "windows-x86_64": {
                  url: "\($dl)/\($win_exe)",
                  signature: $win_nsis_sig
                }
              }
            }')

          # Add macOS platform if artifacts and signature exist
          MAC_SIG=$(read_sig "*.app.tar.gz.sig")
          MAC_TAR=$(find all-artifacts -name "*.app.tar.gz" -type f -exec basename {} \; 2>/dev/null | head -1)
          if [ -n "$MAC_SIG" ] && [ -n "$MAC_TAR" ]; then
            MAC_TAR_CLEAN="${MAC_TAR// /.}"
            UPDATER_JSON=$(echo "$UPDATER_JSON" | jq \
              --arg dl "$DOWNLOAD_BASE" \
              --arg mac_tar "$MAC_TAR_CLEAN" \
              --arg mac_sig "$MAC_SIG" \
              '.platforms["darwin-aarch64"] = { url: "\($dl)/\($mac_tar)", signature: $mac_sig } |
               .platforms["darwin-x86_64"] = { url: "\($dl)/\($mac_tar)", signature: $mac_sig }')
          fi

          # Add Linux platform if artifacts and signature exist
          LINUX_SIG=$(read_sig "*.AppImage.tar.gz.sig")
          LINUX_TAR=$(find all-artifacts -name "*.AppImage.tar.gz" -type f -exec basename {} \; 2>/dev/null | head -1)
          if [ -n "$LINUX_SIG" ] && [ -n "$LINUX_TAR" ]; then
            LINUX_TAR_CLEAN="${LINUX_TAR// /.}"
            UPDATER_JSON=$(echo "$UPDATER_JSON" | jq \
              --arg dl "$DOWNLOAD_BASE" \
              --arg linux_tar "$LINUX_TAR_CLEAN" \
              --arg linux_sig "$LINUX_SIG" \
              '.platforms["linux-x86_64"] = { url: "\($dl)/\($linux_tar)", signature: $linux_sig }')
          fi

          echo "$UPDATER_JSON" > updater.json

          echo "Generated updater.json:"
          cat updater.json

      - name: Collect release files
        run: |
          mkdir -p release-files
          find all-artifacts -type f \( \
            -name "*.exe" -o \
            -name "*.msi" -o \
            -name "*.dmg" -o \
            -name "*.AppImage" -o \
            -name "*.deb" -o \
            -name "*.tar.gz" -o \
            -name "*.zip" -o \
            -name "*.sig" \
          \) -print0 | while IFS= read -r -d '' file; do
            base=$(basename "$file")
            clean_base="${base// /.}"
            cp "$file" "release-files/$clean_base"
          done
          find release-files -maxdepth 1 -type f -print

      - name: Create or Update GitHub Release
        uses: ncipollo/release-action@v1
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          allowUpdates: true
          tag: ${{ github.event.inputs.release_tag || github.ref_name }}
          name: "${{ github.event.inputs.release_tag || github.ref_name }}"
          bodyFile: "release_notes.md"
          token: ${{ secrets.GITHUB_TOKEN }}
          artifacts: "release-files/*,updater.json"
          artifactErrorsFailBuild: false
          replacesArtifacts: true
          makeLatest: legacy

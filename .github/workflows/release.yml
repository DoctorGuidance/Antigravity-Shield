  #             src-tauri/target/release/bundle/appimage/*.sig
  #             src-tauri/target/release/bundle/deb/*.deb
  #           if-no-files-found: warn

  publish-release:
    needs: [build-windows]
    # needs: [build-macos, build-windows, build-linux]
    if: always() && !cancelled() && !contains(needs.*.result, 'failure')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-artifacts
          pattern: "{release-assets-*,updater-json-*}"
          merge-multiple: true

      - name: Extract Release Notes
        run: |
          TARGET_VER="${{ github.event.inputs.release_tag || github.ref_name }}"
          echo "Extracting release notes for version $TARGET_VER"
          awk -v ver="$TARGET_VER" '
            BEGIN { capture=0 }
            $0 ~ "^[[:space:]]*[*+-][[:space:]]+\\*\\*" ver { capture=1; next }
            capture && $0 ~ "^[[:space:]]*[*+-][[:space:]]+\\*\\*v" { capture=0; exit }
            capture { print }
          ' CHANGELOG.md | sed 's/^[[:space:]]\{8\}//' > release_notes.md
          if [ ! -s release_notes.md ]; then
            echo "# Antigravity Shield $TARGET_VER" > release_notes.md
            echo "" >> release_notes.md
            echo "Official release for Antigravity Shield $TARGET_VER. Download the appropriate package for your OS below." >> release_notes.md
          fi

      - name: Build updater.json from signatures
        env:
          VERSION: ${{ github.event.inputs.release_tag || github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          DOWNLOAD_BASE="https://github.com/${REPO}/releases/download/${VERSION}"
          VER="${VERSION#v}"

          read_sig() {
            local pattern="$1"
            local sig_file
            sig_file=$(find all-artifacts -name "$pattern" -type f 2>/dev/null | head -1)
            if [ -n "$sig_file" ] && [ -f "$sig_file" ]; then
              cat "$sig_file"
            else
              echo ""
            fi
          }

          MACOS_AARCH64_SIG=$(read_sig "*_aarch64.app.tar.gz.sig")
          MACOS_X64_SIG=$(read_sig "*_x64.app.tar.gz.sig")
          WINDOWS_NSIS_SIG=$(read_sig "*_x64-setup.exe.sig")
          LINUX_AMD64_SIG=$(read_sig "*_amd64.AppImage.sig")

          WIN_EXE=$(find all-artifacts -name "*_x64-setup.exe" -type f -exec basename {} \; 2>/dev/null | head -1)
          LINUX_APPIMAGE=$(find all-artifacts -name "*_amd64.AppImage" -type f -exec basename {} \; 2>/dev/null | head -1)
          MAC_AARCH64=$(find all-artifacts -name "*_aarch64.app.tar.gz" -type f -exec basename {} \; 2>/dev/null | head -1)
          MAC_X64=$(find all-artifacts -name "*_x64.app.tar.gz" -type f -exec basename {} \; 2>/dev/null | head -1)

          jq -n \
            --arg version "$VER" \
            --arg notes "Antigravity Shield $VERSION release" \
            --arg pub_date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg dl "$DOWNLOAD_BASE" \
            --arg mac_a64_sig "$MACOS_AARCH64_SIG" \
            --arg mac_x64_sig "$MACOS_X64_SIG" \
            --arg win_nsis_sig "$WINDOWS_NSIS_SIG" \
            --arg linux_amd64_sig "$LINUX_AMD64_SIG" \
            --arg win_exe "${WIN_EXE:-Antigravity.Shield_${VER}_x64-setup.exe}" \
            --arg linux_img "${LINUX_APPIMAGE:-Antigravity.Shield_${VER}_amd64.AppImage}" \
            --arg mac_a64 "${MAC_AARCH64:-Antigravity.Shield_aarch64.app.tar.gz}" \
            --arg mac_x64 "${MAC_X64:-Antigravity.Shield_x64.app.tar.gz}" \
            '{
              version: $version,
              notes: $notes,
              pub_date: $pub_date,
              platforms: {
                "darwin-aarch64": {
                  url: "\($dl)/\($mac_a64)",
                  signature: $mac_a64_sig
                },
                "darwin-x86_64": {
                  url: "\($dl)/\($mac_x64)",
                  signature: $mac_x64_sig
                },
                "windows-x86_64": {
                  url: "\($dl)/\($win_exe)",
                  signature: $win_nsis_sig
                },
                "linux-x86_64": {
                  url: "\($dl)/\($linux_img)",
                  signature: $linux_amd64_sig
                }
              }
            }' > updater.json

          echo "Generated updater.json:"
          cat updater.json

      - name: Collect release files
        run: |
          mkdir -p release-files
          find all-artifacts -type f \( \
            -name "*.dmg" -o \
            -name "*.deb" -o \
            -name "*.AppImage" -o \
            -name "*.exe" -o \
            -name "*.app.tar.gz" -o \
            -name "*.sig" \
          \) -print0 | while IFS= read -r -d '' file; do
            cp "$file" release-files/
          done
          find release-files -maxdepth 1 -type f -print

      - name: Create or Update GitHub Release
        uses: ncipollo/release-action@v1
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          allowUpdates: true
          tag: ${{ github.event.inputs.release_tag || github.ref_name }}
          name: "Antigravity Shield ${{ github.event.inputs.release_tag || github.ref_name }}"
          bodyFile: "release_notes.md"
          token: ${{ secrets.GITHUB_TOKEN }}
          artifacts: "release-files/*,updater.json"
          artifactErrorsFailBuild: false
          replacesArtifacts: true
          makeLatest: legacy

name: Release (macOS & iOS)
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release Tag to build (e.g. v5.0.0)'
        required: false
        default: 'v5.0.0'
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-macos:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Rust setup
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: "aarch64-apple-darwin,x86_64-apple-darwin"

      - name: Node.js setup
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install frontend dependencies
        run: npm install --legacy-peer-deps

      - name: Disable updater artifacts without signing key
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          node -e "
          const fs = require('fs');
          const p = 'src-tauri/tauri.conf.json';
          if (fs.existsSync(p)) {
            const c = JSON.parse(fs.readFileSync(p, 'utf8'));
            if (!process.env.TAURI_SIGNING_PRIVATE_KEY || process.env.TAURI_SIGNING_PRIVATE_KEY.trim() === '') {
              if (c.bundle) c.bundle.createUpdaterArtifacts = false;
              fs.writeFileSync(p, JSON.stringify(c, null, 2), 'utf8');
              console.log('No signing key: disabled createUpdaterArtifacts');
            } else {
              console.log('Updater signing key configured.');
            }
          }
          "

      - name: Build aarch64 (Apple Silicon)
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build -- --target aarch64-apple-darwin 2>&1 | tee tauri-build-aarch64.log

      - name: Build x86_64 (Intel)
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build -- --target x86_64-apple-darwin 2>&1 | tee tauri-build-x86_64.log

      - name: Build Universal (.app)
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build -- --target universal-apple-darwin --bundles app 2>&1 | tee tauri-build-universal.log

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-macos
          path: tauri-build-*.log

      - name: Rename macOS assets for architecture
        run: |
          rename_arch() {
            local target_dir="$1"
            local arch="$2"
            if [ -d "$target_dir" ]; then
              cd "$target_dir"
              if [ -f "Antigravity Tools.app.tar.gz" ]; then
                mv "Antigravity Tools.app.tar.gz" "Antigravity Tools_${arch}.app.tar.gz"
                [ -f "Antigravity Tools.app.tar.gz.sig" ] && mv "Antigravity Tools.app.tar.gz.sig" "Antigravity Tools_${arch}.app.tar.gz.sig"
                echo "Renamed $arch assets"
              fi
              cd - > /dev/null
            fi
          }

          rename_arch "src-tauri/target/aarch64-apple-darwin/release/bundle/macos" "aarch64"
          rename_arch "src-tauri/target/x86_64-apple-darwin/release/bundle/macos" "x64"
          rename_arch "src-tauri/target/universal-apple-darwin/release/bundle/macos" "universal"

      - name: Upload updater json
        uses: actions/upload-artifact@v4
        with:
          name: updater-json-macos
          path: src-tauri/target/**/release/bundle/updater/*.json
          if-no-files-found: ignore

      - name: Upload Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-macos
          path: |
            src-tauri/target/**/release/bundle/dmg/*.dmg
            src-tauri/target/**/release/bundle/dmg/*.sig
            src-tauri/target/**/release/bundle/macos/*.app.tar.gz
            src-tauri/target/**/release/bundle/macos/*.app.tar.gz.sig
          if-no-files-found: warn

  build-ios:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Rust setup
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: "aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios"

      - name: Node.js setup
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install frontend dependencies
        run: npm install --legacy-peer-deps

      - name: Build iOS app
        run: |
          npm run tauri ios build -- --export-method app-store-connect 2>&1 | tee ios-build.log

      - name: Upload iOS build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-ios
          path: ios-build.log

      - name: Upload iOS IPA
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-ios
          path: |
            src-tauri/gen/apple/build/arm64/*.ipa
            src-tauri/gen/apple/build/Release-iphoneos/*.ipa
          if-no-files-found: warn

  publish-release:
    needs: [build-macos, build-ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-artifacts
          pattern: "{release-assets-*,updater-json-*}"
          merge-multiple: true

      - name: Extract Release Notes
        run: |
          VERSION="${{ github.ref_name }}"
          echo "Extracting release notes for version $VERSION"
          awk -v ver="$VERSION" '
            BEGIN { capture=0 }
            $0 ~ "^[[:space:]]*[*+-][[:space:]]+\\*\\*" ver { capture=1; next }
            capture && $0 ~ "^[[:space:]]*[*+-][[:space:]]+\\*\\*v" { capture=0; exit }
            capture { print }
          ' CHANGELOG.md | sed 's/^[[:space:]]\{8\}//' > release_notes.md
          if [ ! -s release_notes.md ]; then
            echo "See the assets to download this version and install." > release_notes.md
          fi

      - name: Build updater.json from signatures
        env:
          VERSION: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          DOWNLOAD_BASE="https://github.com/${REPO}/releases/download/${VERSION}"
          VER="${VERSION#v}"

          read_sig() {
            local pattern="$1"
            local sig_file
            sig_file=$(find all-artifacts -name "$pattern" -type f 2>/dev/null | head -1)
            if [ -n "$sig_file" ] && [ -f "$sig_file" ]; then
              cat "$sig_file"
            else
              echo ""
            fi
          }

          MACOS_AARCH64_SIG=$(read_sig "*_aarch64.app.tar.gz.sig")
          MACOS_X64_SIG=$(read_sig "*_x64.app.tar.gz.sig")

          echo "Signatures found:"
          [ -n "$MACOS_AARCH64_SIG" ] && echo "  macOS aarch64: YES" || echo "  macOS aarch64: NO"
          [ -n "$MACOS_X64_SIG" ] && echo "  macOS x64: YES" || echo "  macOS x64: NO"

          jq -n \
            --arg version "$VER" \
            --arg notes "See release page for details" \
            --arg pub_date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg dl "$DOWNLOAD_BASE" \
            --arg mac_a64_sig "$MACOS_AARCH64_SIG" \
            --arg mac_x64_sig "$MACOS_X64_SIG" \
            '{
              version: $version,
              notes: $notes,
              pub_date: $pub_date,
              platforms: {
                "darwin-aarch64": {
                  url: "\($dl)/Antigravity.Tools_aarch64.app.tar.gz",
                  signature: $mac_a64_sig
                },
                "darwin-x86_64": {
                  url: "\($dl)/Antigravity.Tools_x64.app.tar.gz",
                  signature: $mac_x64_sig
                }
              }
            }' > updater.json

          echo "Generated updater.json:"
          cat updater.json

      - name: Collect release files
        run: |
          mkdir -p release-files
          find all-artifacts -type f \( \
            -name "*.dmg" -o \
            -name "*.ipa" -o \
            -name "*.app.tar.gz" -o \
            -name "*.sig" \
          \) -print0 | while IFS= read -r -d '' file; do
            cp "$file" release-files/
          done
          find release-files -maxdepth 1 -type f -print

      - name: Create or Update GitHub Release
        uses: ncipollo/release-action@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          allowUpdates: true
          name: "Antigravity Tools ${{ github.ref_name }}"
          bodyFile: "release_notes.md"
          token: ${{ secrets.GITHUB_TOKEN }}
          artifacts: "release-files/*,updater.json"
          artifactErrorsFailBuild: false
          replacesArtifacts: true
          makeLatest: legacy

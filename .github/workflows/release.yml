name: Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release Tag to build (e.g. v5.3.0)'
        required: false
        default: 'v5.3.0'
        type: string
      build_unix:
        description: 'Force build macOS and Linux (even for patch releases)'
        required: false
        default: false
        type: boolean
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # Check if release is Major/Minor (ends with .0 like 5.3.0) or Patch (e.g. 5.3.1)
  check-release-type:
    name: Check Release Target
    runs-on: ubuntu-latest
    outputs:
      build_unix: ${{ steps.check.outputs.build_unix }}
      target_ver: ${{ steps.check.outputs.target_ver }}
    steps:
      - name: Determine if Unix build is needed
        id: check
        shell: bash
        run: |
          RAW_TAG="${{ github.event.inputs.release_tag || github.ref_name }}"
          FORCE_UNIX="${{ github.event.inputs.build_unix }}"
          
          # Remove leading 'v' if present
          VER="${RAW_TAG#v}"
          echo "target_ver=$VER" >> "$GITHUB_OUTPUT"
          
          # Check if forced via manual workflow_dispatch input
          if [ "$FORCE_UNIX" = "true" ]; then
            echo "build_unix=true" >> "$GITHUB_OUTPUT"
            echo "Unix builds forced via workflow dispatch input."
            exit 0
          fi
          
          # Major or Minor releases end in .0 (e.g. 5.3.0, 5.4.0, 6.0.0)
          # Patch releases have a non-zero patch number (e.g. 5.3.1, 5.3.10)
          if echo "$VER" | grep -Eq '^[0-9]+\.[0-9]+\.0$'; then
            echo "build_unix=true" >> "$GITHUB_OUTPUT"
            echo "Version $VER is a Major/Minor release (.0). Enabling macOS and Linux builds."
          else
            echo "build_unix=false" >> "$GITHUB_OUTPUT"
            echo "Version $VER is a Patch release. Skipping macOS and Linux builds to save Actions quota."
          fi

  # Windows Build (Runs on every release: both Patch and Major/Minor)
  build-windows:
    name: Build Windows (.exe)
    runs-on: windows-2025
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Rust setup
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Node.js setup
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"

      - name: Install frontend dependencies
        run: npm install --legacy-peer-deps --prefer-offline

      - name: Sync version from release tag & optimize build speed
        shell: bash
        run: |
          TARGET_VER="${{ github.event.inputs.release_tag || github.ref_name }}"
          TARGET_VER="${TARGET_VER#v}"
          if [ -n "$TARGET_VER" ] && [ "$TARGET_VER" != "refs/heads/main" ]; then
            echo "Synchronizing project versions to $TARGET_VER"
            node -e "
              const fs = require('fs');
              ['package.json', 'src-tauri/tauri.conf.json'].forEach(f => {
                if (fs.existsSync(f)) {
                  const d = JSON.parse(fs.readFileSync(f, 'utf8'));
                  d.version = '$TARGET_VER';
                  fs.writeFileSync(f, JSON.stringify(d, null, 2) + '\n');
                }
              });
            "
            if [ -f src-tauri/Cargo.toml ]; then
              sed -i.bak -E "s/^version = \"[0-9]+\.[0-9]+\.[0-9]+.*\"/version = \"$TARGET_VER\"/" src-tauri/Cargo.toml && rm -f src-tauri/Cargo.toml.bak
            fi
            if [ -f src-tauri/Cargo.lock ]; then
              sed -i.bak -E '/name = "antigravity-shield"/{n;s/version = "[0-9]+\.[0-9]+\.[0-9]+.*"/version = "'"$TARGET_VER"'"/;}' src-tauri/Cargo.lock && rm -f src-tauri/Cargo.lock.bak
            fi
            cargo update -p antigravity-shield --manifest-path src-tauri/Cargo.toml || true
          fi
          # Speed up frontend build: bypass full tsc typecheck during release build (CI already checks tsc)
          node -e "
            const fs = require('fs');
            const p = 'src-tauri/tauri.conf.json';
            if (fs.existsSync(p)) {
              const c = JSON.parse(fs.readFileSync(p, 'utf8'));
              if (c.build) c.build.beforeBuildCommand = 'npx vite build';
              fs.writeFileSync(p, JSON.stringify(c, null, 2), 'utf8');
              console.log('Optimized beforeBuildCommand to npx vite build');
            }
          "

      - name: Disable updater artifacts without signing key
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          node -e "
          const fs = require('fs');
          const p = 'src-tauri/tauri.conf.json';
          if (fs.existsSync(p)) {
            const c = JSON.parse(fs.readFileSync(p, 'utf8'));
            if (!process.env.TAURI_SIGNING_PRIVATE_KEY || process.env.TAURI_SIGNING_PRIVATE_KEY.trim() === '') {
              if (c.bundle) c.bundle.createUpdaterArtifacts = false;
              fs.writeFileSync(p, JSON.stringify(c, null, 2), 'utf8');
              console.log('No signing key: disabled createUpdaterArtifacts');
            } else {
              console.log('Updater signing key configured.');
            }
          }
          "

      - name: Build Windows NSIS installer
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri build --bundles nsis --ignore-version-mismatches 2>&1 | tee tauri-build-windows.log

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-windows
          path: tauri-build-windows.log

      - name: Upload updater json
        uses: actions/upload-artifact@v4
        with:
          name: updater-json-windows
          path: src-tauri/target/release/bundle/updater/*.json
          if-no-files-found: ignore

      - name: Upload Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.sig
          if-no-files-found: warn

  # macOS Build (Only runs on Major/Minor releases like 5.3.0, skipped for patch releases like 5.3.1)
  build-macos:
    name: Build macOS (.dmg)
    needs: [check-release-type]
    if: needs.check-release-type.outputs.build_unix == 'true'
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Rust setup
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache

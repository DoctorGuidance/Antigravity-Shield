name: Create GitHub Release (Assets uploaded locally)

# Builds are done LOCALLY via scripts/release-local.ps1
# This workflow only creates the GitHub Release entry with notes from CHANGELOG.md
# Assets (.exe, updater.json, .sig) are uploaded by the local release script.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag (e.g. v5.0.3)'
        required: true
        default: 'v5.0.3'
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Release Notes from CHANGELOG.md
        run: |
          TARGET_VER="${{ github.event.inputs.release_tag || github.ref_name }}"
          echo "Extracting release notes for $TARGET_VER"

          awk -v ver="$TARGET_VER" '
            BEGIN { capture=0 }
            $0 ~ "^[[:space:]]*[*+-][[:space:]]+\\*\\*" ver { capture=1; next }
            capture && $0 ~ "^[[:space:]]*[*+-][[:space:]]+\\*\\*v" { capture=0; exit }
            capture { print }
          ' CHANGELOG.md | sed 's/^[[:space:]]\{8\}//' > raw_notes.md

          echo "# Antigravity Shield $TARGET_VER" > release_notes.md
          echo "" >> release_notes.md
          if [ -s raw_notes.md ]; then
            cat raw_notes.md >> release_notes.md
            rm -f raw_notes.md
          else
            echo "Official release for Antigravity Shield $TARGET_VER." >> release_notes.md
            echo "Download the Windows installer below." >> release_notes.md
          fi

          echo "--- Generated Release Notes ---"
          cat release_notes.md

      - name: Create Draft GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}
          name: Antigravity Shield ${{ github.event.inputs.release_tag || github.ref_name }}
          body_path: release_notes.md
          draft: true
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

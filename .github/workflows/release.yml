name: Release (Windows, macOS & Linux)
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release Tag to build (e.g. v5.0.0)'
        required: false
        default: 'v5.0.0'
        type: string
      build_windows:
        description: 'Build Windows Installer (.exe)'
        required: false
        default: true
        type: boolean
      build_linux:
        description: 'Build Linux Packages (AppImage, deb)'
        required: false
        default: false
        type: boolean
      build_macos:
        description: 'Build macOS DMG'
        required: false
        default: false
        type: boolean
  push:
    tags:
      - 'v*'


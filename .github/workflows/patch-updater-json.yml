name: Patch v5.0.7 updater.json

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/patch-updater-json.yml'
  workflow_dispatch:

jobs:
  patch-updater-json:
    name: Patch v5.0.7 updater.json
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create corrected updater.json
        run: |
          cat << 'EOF' > updater.json
          {
            "version": "5.0.7",
            "notes": "Antigravity Shield v5.0.7 release",
            "pub_date": "2026-09-09T04:47:24Z",
            "platforms": {
              "windows-x86_64": {
                "url": "https://github.com/DoctorGuidance/Antigravity-Shield/releases/download/v5.0.7/Antigravity.Shield_5.0.7_x64-setup.exe",
                "signature": ""
              }
            }
          }
          EOF

      - name: Update v5.0.7 Release Asset
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          tag: v5.0.7
          name: v5.0.7
          token: ${{ secrets.GITHUB_TOKEN }}
          artifacts: "updater.json"
          replacesArtifacts: true
          makeLatest: legacy
